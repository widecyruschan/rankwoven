services:
  web:
    build:
      context: .
    command: sh -c "npm install && npm run dev -w @aieo/web -- --host 0.0.0.0"
    working_dir: /workspace
    ports:
      - '8080:5173'
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3011}
    depends_on:
      - api

  api:
    build:
      context: .
    command: sh -c "npm install && npm run build -w @aieo/cms-adapters && npm run build -w @aieo/ai-providers && npm run dev -w @aieo/api"
    working_dir: /workspace
    ports:
      - '3011:3000'
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgresql://aieo:aieo_password@postgres:5432/aieo
      REDIS_URL: redis://redis:6379
      WORDPRESS_CREDENTIAL_ENCRYPTION_KEY: ${WORDPRESS_CREDENTIAL_ENCRYPTION_KEY:-rankwoven-local-development-key}
      AI_TEXT_PROVIDER: ${AI_TEXT_PROVIDER:-wenwen}
      AI_FALLBACK_TEXT_PROVIDER: ${AI_FALLBACK_TEXT_PROVIDER:-wenwen}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-wenwen}
      AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER:-wenwen}
      AI_IMAGE_FALLBACK_PROVIDER: ${AI_IMAGE_FALLBACK_PROVIDER:-wenwen}
      WENWEN_API_BASE_URL: ${WENWEN_API_BASE_URL:-https://breakout.wenwen-ai.com}
      WENWEN_API_KEY: ${WENWEN_API_KEY:-}
      WENWEN_TEXT_MODEL: ${WENWEN_TEXT_MODEL:-gpt-4.1-mini}
      WENWEN_EMBEDDING_MODEL: ${WENWEN_EMBEDDING_MODEL:-text-embedding-3-small}
      WENWEN_IMAGE_MODEL: ${WENWEN_IMAGE_MODEL:-gemini-2.5-flash-image}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS_BASE64: ${GOOGLE_APPLICATION_CREDENTIALS_BASE64:-}
      KEYWORD_VOLUME_PROVIDER: ${KEYWORD_VOLUME_PROVIDER:-generic}
      KEYWORD_VOLUME_API_URL: ${KEYWORD_VOLUME_API_URL:-}
      KEYWORD_VOLUME_API_KEY: ${KEYWORD_VOLUME_API_KEY:-}

  worker:
    build:
      context: .
    command: sh -c "npm install && npm run build -w @aieo/cms-adapters && npm run build -w @aieo/ai-providers && npm run dev -w @aieo/worker"
    working_dir: /workspace
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://aieo:aieo_password@postgres:5432/aieo
      REDIS_URL: redis://redis:6379
      WORDPRESS_CREDENTIAL_ENCRYPTION_KEY: ${WORDPRESS_CREDENTIAL_ENCRYPTION_KEY:-rankwoven-local-development-key}
      WENWEN_API_BASE_URL: ${WENWEN_API_BASE_URL:-https://breakout.wenwen-ai.com}
      WENWEN_API_KEY: ${WENWEN_API_KEY:-}

  postgres:
    profiles:
      - data
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aieo
      POSTGRES_PASSWORD: aieo_password
      POSTGRES_DB: aieo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aieo -d aieo']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles:
      - data
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
