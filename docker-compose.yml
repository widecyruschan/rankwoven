services:
  web:
    build:
      context: .
    command: sh -c "npm install && npm run dev -w @aieo/web -- --host 0.0.0.0"
    working_dir: /workspace
    ports:
      - '8080:5173'
    environment:
      VITE_API_BASE_URL: https://api.rankwoven.com
    depends_on:
      - api

  api:
    build:
      context: .
    command: sh -c "npm install && npm run build -w @aieo/cms-adapters && npm run build -w @aieo/ai-providers && npm run dev -w @aieo/api"
    working_dir: /workspace
    ports:
      - '3011:3000'
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgresql://aieo:aieo_password@postgres:5432/aieo
      REDIS_URL: redis://redis:6379

  worker:
    build:
      context: .
    command: sh -c "npm install && npm run build -w @aieo/cms-adapters && npm run build -w @aieo/ai-providers && npm run dev -w @aieo/worker"
    working_dir: /workspace
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://aieo:aieo_password@postgres:5432/aieo
      REDIS_URL: redis://redis:6379

  postgres:
    profiles:
      - data
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aieo
      POSTGRES_PASSWORD: aieo_password
      POSTGRES_DB: aieo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aieo -d aieo']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles:
      - data
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
