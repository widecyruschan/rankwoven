map $request_uri $rankwoven_robots_header {
    default "";
    ~^/(app|admin|login|register|forgot-password|reset-password)(/|$) "noindex, nofollow, noarchive";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $rankwoven_robots_header always;

    # Static assets — long cache (fingerprinted by Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag $rankwoven_robots_header always;
        access_log off;
    }

    # favicon / robots.txt
    location = /favicon.ico {
        expires 1w;
        add_header X-Robots-Tag $rankwoven_robots_header always;
        access_log off;
    }

    location = /robots.txt {
        expires 1d;
        add_header X-Robots-Tag $rankwoven_robots_header always;
        access_log off;
    }

    location = /sitemap.xml {
        expires 1d;
        add_header X-Robots-Tag $rankwoven_robots_header always;
        access_log off;
        try_files $uri =404;
    }

    # Backoffice routes should never be indexed by search bots.
    location ~ ^/(app|admin)(/|$) {
        add_header X-Robots-Tag $rankwoven_robots_header always;
        try_files $uri /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Authentication pages are not public content and must stay out of search indexes
    # even before the Vue router has executed in the browser.
    location ~ ^/(login|register|forgot-password|reset-password)(/|$) {
        add_header X-Robots-Tag $rankwoven_robots_header always;
        try_files $uri /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        add_header X-Robots-Tag $rankwoven_robots_header always;
        try_files $uri /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
