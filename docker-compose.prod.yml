# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile data up -d --build
services:
  web:
    # Override dev web service with production Nginx static build
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.rankwoven.com}
    command: null
    ports: !override
      - '127.0.0.1:8082:80'
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.rankwoven.com}
    profiles: []

  api:
    profiles: []
    build:
      context: .
      dockerfile: Dockerfile.production
    volumes: !override []
    command: sh -c "npm run build -w @aieo/cms-adapters && npm run build -w @aieo/ai-providers && npm run build -w @aieo/security && npm run build -w @aieo/api && npm run start:production -w @aieo/api"
    environment:
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:-https://rankwoven.com}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured for production}
      LEGACY_PASSWORD_HMAC_SECRET: ${LEGACY_PASSWORD_HMAC_SECRET:-}
      WORDPRESS_CREDENTIAL_ENCRYPTION_KEY: ${WORDPRESS_CREDENTIAL_ENCRYPTION_KEY:?WORDPRESS_CREDENTIAL_ENCRYPTION_KEY must be configured for production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://rankwoven.com,https://www.rankwoven.com,https://app.rankwoven.com}
      TRUST_PROXY: 'true'
      ALLOW_LOCAL_LIGHTHOUSE_FALLBACK: 'false'
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER_MONTHLY: ${STRIPE_PRICE_STARTER_MONTHLY:-}
      STRIPE_PRICE_GROWTH_MONTHLY: ${STRIPE_PRICE_GROWTH_MONTHLY:-}
      STRIPE_PRICE_AGENCY_MONTHLY: ${STRIPE_PRICE_AGENCY_MONTHLY:-}
      STRIPE_BILLING_PORTAL_CONFIGURATION_ID: ${STRIPE_BILLING_PORTAL_CONFIGURATION_ID:-}

  worker:
    profiles: []
    build:
      context: .
      dockerfile: Dockerfile.production
    volumes: !override []
    command: sh -c "npm run build -w @aieo/cms-adapters && npm run build -w @aieo/ai-providers && npm run build -w @aieo/security && npm run build -w @aieo/worker && npm run start:production -w @aieo/worker"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured for production}
      WORDPRESS_CREDENTIAL_ENCRYPTION_KEY: ${WORDPRESS_CREDENTIAL_ENCRYPTION_KEY:?WORDPRESS_CREDENTIAL_ENCRYPTION_KEY must be configured for production}
      KEYWORD_VOLUME_PROVIDER: ${KEYWORD_VOLUME_PROVIDER:-generic}
      KEYWORD_VOLUME_API_URL: ${KEYWORD_VOLUME_API_URL:-}
      KEYWORD_VOLUME_API_KEY: ${KEYWORD_VOLUME_API_KEY:-}
      AHREFS_KEYWORD_METRICS_ENABLED: ${AHREFS_KEYWORD_METRICS_ENABLED:-false}
      AHREFS_API_URL: ${AHREFS_API_URL:-}
      AHREFS_API_KEY: ${AHREFS_API_KEY:-}
      SEMRUSH_API_URL: ${SEMRUSH_API_URL:-}
      SEMRUSH_API_KEY: ${SEMRUSH_API_KEY:-}
